name: Ausflug Anmeldung
version: "1.3.2"
slug: ausflug
description: Anmeldeseite für einen Vereinsausflug, mit Preisen für Mitglieder und Nichtmitglieder und Zahlung per Überweisung (GiroCode) oder PayPal
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
# Der Supervisor ruft die Startseite regelmäßig auf und startet das Add-on
# neu, wenn sie nicht mehr antwortet. Port 8081, damit dieses Add-on neben
# der Gedenkveranstaltung (8080) laufen kann.
watchdog: "http://[HOST]:[PORT:8081]/"

ingress: true
ingress_port: 8099
panel_icon: mdi:bus
panel_title: Ausflug
panel_admin: true

ports:
  8081/tcp: 8081
ports_description:
  8081/tcp: Öffentliche Anmeldeseite für den Ausflug
webui: "http://[HOST]:[PORT:8081]"

homeassistant_api: true

options:
  # Ausflug
  titel: Vereinsausflug der Feuerwehr Lehrberg
  untertitel: Vereinsausflug
  datum: ""
  uhrzeit: ""
  ort: ""
  ziel: ""
  text: >-
    Unser Ausflug geht zum Weihnachtsmarkt nach Ulm. Dort hat jeder Zeit, sich selbst umzusehen. | Am Abend essen wir auf der Rückfahrt gemeinsam in einem Lokal. | Bitte melden Sie sich über diese Seite an.
  ablauf: ""
  kontakt: ""
  # Anmeldung
  anmeldung_offen: true
  plaetze_gesamt: 50
  max_personen_pro_anmeldung: 6
  anmeldeschluss: ""
  essen: []
  getraenke: []
  email_abfragen: true
  datenschutz_hinweis: Die Angaben werden nur für die Planung des Ausflugs verwendet.
  # Preise und Zahlung
  preis_mitglied: "15,00"
  preis_nichtmitglied: "25,00"
  iban: ""
  kontoinhaber: ""
  bic: ""
  paypal_client_id: ""
  paypal_secret: ""
  paypal_modus: sandbox
  paypal_me: ""
  paypal_email: ""
  zahlung_hinweis: Bitte bar beim Ausflug zahlen.
  # Bestätigungsmail
  veranstalter: ""
  smtp_server: ""
  smtp_port: 587
  smtp_verschluesselung: starttls
  smtp_benutzer: ""
  smtp_passwort: ""
  smtp_absender: ""
  smtp_antwort_an: ""
  # Webseite und Rechtliches
  oeffentliche_adresse: ""
  impressum: ""
  datenschutz: ""
  loeschfrist: 4 Wochen
  nur_fuer_ip: ""
  # Home Assistant
  sensor_erstellen: true
  benachrichtigung_dienst: ""
  benachrichtigung_jede_anmeldung: true
  benachrichtigung_schwellen: ""

# Die Reihenfolge hier ist die Reihenfolge in der Einstellungsseite. Die
# Schlüssel selbst bleiben, wie sie sind: ein umbenannter Schlüssel würde
# den gespeicherten Wert verlieren. Lesbare Namen und Erklärungen stehen in
# translations/de.yaml und translations/en.yaml.
#
# Die Preise sind Text und keine Zahl: so lassen sie sich so eintragen, wie
# man sie schreibt („15,50“). server.py liest sie in Cent.
schema:
  titel: str
  untertitel: str?
  datum: str?
  uhrzeit: str?
  ort: str?
  ziel: str?
  text: str?
  ablauf: str?
  kontakt: str?
  anmeldung_offen: bool
  plaetze_gesamt: int(1,100000)
  max_personen_pro_anmeldung: int(1,999)
  anmeldeschluss: str?
  essen:
    - str
  getraenke:
    - str
  email_abfragen: bool
  datenschutz_hinweis: str?
  preis_mitglied: str
  preis_nichtmitglied: str
  iban: str?
  kontoinhaber: str?
  bic: str?
  paypal_client_id: str?
  paypal_secret: password?
  paypal_modus: list(sandbox|live)
  paypal_me: str?
  paypal_email: str?
  zahlung_hinweis: str?
  veranstalter: str?
  smtp_server: str?
  smtp_port: port
  smtp_verschluesselung: list(starttls|ssl|keine)
  smtp_benutzer: str?
  smtp_passwort: password?
  smtp_absender: str?
  smtp_antwort_an: str?
  oeffentliche_adresse: str?
  impressum: str?
  datenschutz: str?
  loeschfrist: str?
  nur_fuer_ip: str?
  sensor_erstellen: bool
  benachrichtigung_dienst: str?
  benachrichtigung_jede_anmeldung: bool
  benachrichtigung_schwellen: str?
