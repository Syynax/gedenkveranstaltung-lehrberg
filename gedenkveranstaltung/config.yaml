name: Gedenkveranstaltung Anmeldung
version: "1.10.1"
slug: gedenkveranstaltung
description: Anmeldeseite mit begrenzter Platzzahl für eine Gedenkveranstaltung
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto
# Der Supervisor ruft die Startseite regelmaessig auf und startet das Add-on
# neu, wenn sie nicht mehr antwortet.
watchdog: "http://[HOST]:[PORT:8080]/"

ingress: true
ingress_port: 8099
panel_icon: mdi:candle
panel_title: Anmeldungen
panel_admin: true

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Öffentliche Anmeldeseite für die Gäste
webui: "http://[HOST]:[PORT:8080]"

homeassistant_api: true

options:
  # Veranstaltung
  titel: 20. Jahrestag der Gasexplosion in Lehrberg
  untertitel: Gedenkveranstaltung
  datum: ""
  uhrzeit: "9:30"
  ort: ""
  text: >-
    Vor 20 Jahren kam es in Lehrberg zu einer Gasexplosion. Aus diesem Anlass lädt die Freiwillige Feuerwehr Lehrberg zu einer Gedenkveranstaltung ein. Eingeladen sind alle aus Lehrberg und den Nachbarorten. | Aktive Feuerwehrkameradinnen und -kameraden sind herzlich willkommen, in Uniform zu kommen. | Die Zahl der Plätze ist begrenzt, und Essen und Getränke müssen vorbestellt werden. Wir bitten deshalb um eine Anmeldung über diese Seite.
  ablauf: ""
  kontakt: ""
  # Anmeldung
  anmeldung_offen: true
  plaetze_gesamt: 120
  max_personen_pro_anmeldung: 10
  anmeldeschluss: ""
  essen:
    - Weißwürste
    - Wiener
  getraenke:
    - Weizen
    - Weizen, alkoholfrei
    - Helles
    - Helles, alkoholfrei
    - Alkoholfreies Getränk
  email_abfragen: true
  datenschutz_hinweis: Die Angaben werden nur für die Planung der Veranstaltung verwendet.
  # Bestätigungsmail
  veranstalter: ""
  smtp_server: ""
  smtp_port: 587
  smtp_verschluesselung: starttls
  smtp_benutzer: ""
  smtp_passwort: ""
  smtp_absender: ""
  smtp_antwort_an: ""
  # Webseite und Rechtliches
  oeffentliche_adresse: ""
  impressum: ""
  datenschutz: ""
  loeschfrist: 4 Wochen
  nur_fuer_ip: ""
  # Home Assistant
  sensor_erstellen: true
  benachrichtigung_dienst: ""
  benachrichtigung_jede_anmeldung: true
  benachrichtigung_schwellen: ""

# Die Reihenfolge hier ist die Reihenfolge in der Einstellungsseite. Die
# Schluessel selbst bleiben, wie sie sind: ein umbenannter Schluessel wuerde
# den gespeicherten Wert verlieren. Lesbare Namen und Erklaerungen stehen in
# translations/de.yaml und translations/en.yaml.
schema:
  titel: str
  untertitel: str?
  datum: str?
  uhrzeit: str?
  ort: str?
  text: str?
  ablauf: str?
  kontakt: str?
  anmeldung_offen: bool
  plaetze_gesamt: int(1,100000)
  max_personen_pro_anmeldung: int(1,999)
  anmeldeschluss: str?
  essen:
    - str
  getraenke:
    - str
  email_abfragen: bool
  datenschutz_hinweis: str?
  veranstalter: str?
  smtp_server: str?
  smtp_port: port
  smtp_verschluesselung: list(starttls|ssl|keine)
  smtp_benutzer: str?
  smtp_passwort: password?
  smtp_absender: str?
  smtp_antwort_an: str?
  oeffentliche_adresse: str?
  impressum: str?
  datenschutz: str?
  loeschfrist: str?
  nur_fuer_ip: str?
  sensor_erstellen: bool
  benachrichtigung_dienst: str?
  benachrichtigung_jede_anmeldung: bool
  benachrichtigung_schwellen: str?
