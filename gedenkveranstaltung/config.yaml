name: Gedenkveranstaltung Anmeldung
version: "1.4.1"
slug: gedenkveranstaltung
description: Anmeldeseite mit begrenzter Platzzahl für eine Gedenkveranstaltung
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: application
boot: auto

ingress: true
ingress_port: 8099
panel_icon: mdi:candle
panel_title: Anmeldungen
panel_admin: true

ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Öffentliche Anmeldeseite für die Gäste
webui: "http://[HOST]:[PORT:8080]"

homeassistant_api: true

options:
  untertitel: Gedenkveranstaltung
  titel: 20. Jahrestag der Gasexplosion in Lehrberg
  datum: ""
  uhrzeit: "9:30"
  ort: ""
  ablauf: ""
  text: |-
    Vor zwanzig Jahren kam es in Lehrberg zu einer Gasexplosion. Zum Jahrestag lädt die Freiwillige Feuerwehr zu einer Gedenkveranstaltung ein.

    Der Vormittag beginnt mit einer kurzen Ansprache und dem gemeinsamen Gedenken. Danach sitzen wir bei Weißwürsten und Getränken zusammen. Eingeladen sind alle aus Lehrberg und den Nachbarorten, besonders die damaligen Einsatzkräfte und alle, die geholfen haben.

    Die Zahl der Plätze ist begrenzt, und Essen und Getränke müssen vorbestellt werden. Wir bitten deshalb um eine Anmeldung über diese Seite.
  plaetze_gesamt: 120
  max_personen_pro_anmeldung: 10
  anmeldeschluss: ""
  kontakt: ""
  essen:
    - Weißwürste
    - Wiener
  getraenke:
    - Weizen
    - Weizen, alkoholfrei
    - Helles
    - Helles, alkoholfrei
    - Alkoholfreies Getränk
  anmeldung_offen: true
  datenschutz_hinweis: Die Angaben werden nur für die Planung der Veranstaltung verwendet.
  sensor_erstellen: true
  benachrichtigung_dienst: ""
  benachrichtigung_jede_anmeldung: true
  benachrichtigung_schwellen: ""

